# ========= DataSource =========
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========= JPA =========
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========= Serveur =========
server.port=8080

# ========= Mail =========
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# Adresse d’expéditeur par défaut (optionnel)
app.mail.from=Boulevard Sécurité <${SPRING_MAIL_USERNAME}>

# ========= App =========
app.public-url=${APP_PUBLIC_URL:http://localhost:3000}

# ========= JWT =========
security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-validity-ms=${JWT_ACCESS_VALIDITY_MS:7200000}
security.jwt.refresh-token-validity-ms=${JWT_REFRESH_VALIDITY_MS:2592000000}

# ========= Divers =========
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO

# ======================
# JOURS FÉRIÉS
# ======================
feries.base-url=${FERIES_BASE_URL}
feries.zone=${FERIES_ZONE:metropole}
feries.timeout-ms=${FERIES_TIMEOUT_MS:2500}
feries.cache-years=${FERIES_CACHE_YEARS:5}
# ======================
# SMS (Textbelt)
# ======================
textbelt.api.key=textbelt


# ======================
# JACKSON / DATES
# ======================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ======================
# LOGS
# ======================
logging.level.org.hibernate.SQL=DEBUG
# Durée de vie du code OTP (en minutes)
app.email.verification.otp-expiration-minutes=15
# pour voir pourquoi ça bloque si ça rebloque
logging.level.org.springframework.security=DEBUG

# Durées d?expiration des tokens (heures)
app.email.verification.expiration-hours=24
app.password.reset.expiration-hours=2